cases:
  # Adult fixed dose checks for zorapine (min: 10 mg, max: 50 mg, daily: 100 mg)
  - id: "MECH_DOSE_01_NORMAL"
    drug: "zorapine"
    dose_mg: 25.0
    expected_status: "OK"
    tripwire: false

  - id: "MECH_DOSE_02_AT_MIN"
    drug: "zorapine"
    dose_mg: 10.0
    expected_status: "OK"
    tripwire: false

  - id: "MECH_DOSE_03_AT_MAX"
    drug: "zorapine"
    dose_mg: 50.0
    expected_status: "OK"
    tripwire: false

  - id: "MECH_DOSE_04_BELOW_MIN"
    drug: "zorapine"
    dose_mg: 5.0
    expected_status: "BELOW_MINIMUM"
    tripwire: false

  - id: "MECH_DOSE_05_EXCEEDS_MAX"
    drug: "zorapine"
    dose_mg: 60.0
    expected_status: "EXCEEDS_CEILING"
    tripwire: false

  - id: "MECH_DOSE_06_10X_TRIPWIRE_HIGH"
    drug: "zorapine"
    dose_mg: 500.0
    expected_status: "EXCEEDS_CEILING"
    tripwire: true

  - id: "MECH_DOSE_07_0_1X_TRIPWIRE_LOW"
    drug: "zorapine"
    dose_mg: 0.5
    expected_status: "BELOW_MINIMUM"
    tripwire: true

  - id: "MECH_DOSE_08_100X_TRIPWIRE_HIGH"
    drug: "zorapine"
    dose_mg: 5000.0
    expected_status: "EXCEEDS_CEILING"
    tripwire: true

  # Paediatric weight-based dose for zorapine (min: 1.0 mg/kg, max: 2.0 mg/kg, cap: 50.0 mg)
  - id: "MECH_PAED_01_NORMAL_10KG"
    drug: "zorapine"
    weight_kg: 10.0
    dose_mg: 15.0
    expected_status: "OK"
    expected_calc_min: 10.0
    expected_calc_max: 20.0

  - id: "MECH_PAED_02_MIN_10KG"
    drug: "zorapine"
    weight_kg: 10.0
    dose_mg: 10.0
    expected_status: "OK"
    expected_calc_min: 10.0
    expected_calc_max: 20.0

  - id: "MECH_PAED_03_MAX_10KG"
    drug: "zorapine"
    weight_kg: 10.0
    dose_mg: 20.0
    expected_status: "OK"
    expected_calc_min: 10.0
    expected_calc_max: 20.0

  - id: "MECH_PAED_04_EXCEEDS_10KG"
    drug: "zorapine"
    weight_kg: 10.0
    dose_mg: 25.0
    expected_status: "EXCEEDS_CEILING"
    expected_calc_min: 10.0
    expected_calc_max: 20.0

  - id: "MECH_PAED_05_BELOW_10KG"
    drug: "zorapine"
    weight_kg: 10.0
    dose_mg: 8.0
    expected_status: "BELOW_MINIMUM"
    expected_calc_min: 10.0
    expected_calc_max: 20.0

  - id: "MECH_PAED_06_CAPPED_AT_DAILY_MAX"
    drug: "zorapine"
    weight_kg: 40.0
    # 40kg * 2 mg/kg = 80 mg, but cap is 50 mg
    dose_mg: 55.0
    expected_status: "EXCEEDS_CEILING"
    expected_calc_max: 50.0

  - id: "MECH_PAED_07_EXACT_CAP"
    drug: "zorapine"
    weight_kg: 40.0
    dose_mg: 50.0
    expected_status: "OK"
    expected_calc_max: 50.0

  # Volume calculation from concentration (zorapine 10 mg/mL; quenmycin 50 mg/mL = 100mg/2mL)
  - id: "MECH_VOL_01_10MG"
    drug: "zorapine"
    dose_mg: 10.0
    expected_volume_ml: 1.0

  - id: "MECH_VOL_02_25MG"
    drug: "zorapine"
    dose_mg: 25.0
    expected_volume_ml: 2.5

  - id: "MECH_VOL_03_50MG"
    drug: "zorapine"
    dose_mg: 50.0
    expected_volume_ml: 5.0

  - id: "MECH_VOL_04_QUEN_100MG"
    drug: "quenmycin"
    dose_mg: 100.0
    expected_volume_ml: 2.0

  - id: "MECH_VOL_05_QUEN_250MG"
    drug: "quenmycin"
    dose_mg: 250.0
    expected_volume_ml: 5.0

  # Unit conversions (mcg, mg, g)
  - id: "MECH_UNIT_01_MCG_TO_MG"
    amount: 1000.0
    from_unit: "mcg"
    to_unit: "mg"
    expected_amount: 1.0

  - id: "MECH_UNIT_02_MG_TO_G"
    amount: 2500.0
    from_unit: "mg"
    to_unit: "g"
    expected_amount: 2.5

  - id: "MECH_UNIT_03_G_TO_MG"
    amount: 0.5
    from_unit: "g"
    to_unit: "mg"
    expected_amount: 500.0

  - id: "MECH_UNIT_04_MG_TO_MCG"
    amount: 0.25
    from_unit: "mg"
    to_unit: "mcg"
    expected_amount: 250.0

  - id: "MECH_UNIT_05_MCG_KG_TO_MG_KG"
    amount: 1000.0
    from_unit: "mcg/kg"
    to_unit: "mg/kg"
    expected_amount: 1.0

  # Lookback windows (zorapine lookback: 12h, quenmycin lookback: 24h)
  - id: "MECH_LOOKBACK_01_INSIDE_WINDOW_6H"
    last_dose_hours_ago: 6.0
    rule: "FICT_LOOKBACK_12H"
    expected_fire: true

  - id: "MECH_LOOKBACK_02_INSIDE_WINDOW_11_9H"
    last_dose_hours_ago: 11.9
    rule: "FICT_LOOKBACK_12H"
    expected_fire: true

  - id: "MECH_LOOKBACK_03_EXACT_WINDOW_12H"
    last_dose_hours_ago: 12.0
    rule: "FICT_LOOKBACK_12H"
    expected_fire: true

  - id: "MECH_LOOKBACK_04_OUTSIDE_WINDOW_12_1H"
    last_dose_hours_ago: 12.1
    rule: "FICT_LOOKBACK_12H"
    expected_fire: false

  - id: "MECH_LOOKBACK_05_OUTSIDE_WINDOW_24H"
    last_dose_hours_ago: 24.0
    rule: "FICT_LOOKBACK_12H"
    expected_fire: false

  - id: "MECH_LOOKBACK_06_UNKNOWN_TIMESTAMP"
    last_dose_hours_ago: null
    rule: "FICT_LOOKBACK_12H"
    expected_skip: true

  # Vitals interlock threshold comparisons (zorapine: SBP < 85 -> BLOCK)
  - id: "MECH_VITALS_01_BELOW_84"
    sbp: 84
    expected_fire: true
    expected_severity: "BLOCK"

  - id: "MECH_VITALS_02_BELOW_60"
    sbp: 60
    expected_fire: true
    expected_severity: "BLOCK"

  - id: "MECH_VITALS_03_EXACT_85"
    sbp: 85
    expected_fire: false

  - id: "MECH_VITALS_04_ABOVE_86"
    sbp: 86
    expected_fire: false

  - id: "MECH_VITALS_05_NORMAL_120"
    sbp: 120
    expected_fire: false

  - id: "MECH_VITALS_06_UNKNOWN_SBP"
    sbp: null
    expected_skip: true

  # Therapeutic duplication checks
  - id: "MECH_DUP_01_SINGLE_AGENT"
    medications: ["zorapine"]
    expected_fire: false

  - id: "MECH_DUP_02_DUPLICATE_AGENTS"
    medications: ["zorapine", "zorapine"]
    expected_fire: true
    expected_severity: "HIGH"

  # Fixed-dose combination multi-ingredient ceiling checks
  - id: "MECH_FDC_01_BOTH_UNDER_CEILING"
    drug: "zorapine_plus"
    dose_zorapine_mg: 50.0
    dose_quenmycin_mg: 100.0
    expected_status: "OK"

  - id: "MECH_FDC_02_SECOND_EXCEEDS_CEILING"
    drug: "zorapine_plus"
    dose_zorapine_mg: 50.0
    dose_quenmycin_mg: 250.0
    expected_status: "EXCEEDS_CEILING"
