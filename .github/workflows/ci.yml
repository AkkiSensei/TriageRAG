name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          cd web && npm ci && cd ..

      - name: Run verification gate
        run: |
          python tools/tasks.py verify

      - name: Run frontend verification
        run: |
          python tools/tasks.py web-verify

      - name: Run evaluation suites
        run: |
          python tools/tasks.py eval

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start container stack
        run: |
          docker compose up -d --build
          sleep 10

      - name: Healthcheck smoke test
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health

      - name: Retrieval explain endpoint smoke test
        run: |
          curl --fail -X POST http://localhost:8000/api/triage/explain \
            -H "Content-Type: application/json" \
            -d '{"population":"adult","suspected_syndrome":"chest_pain","vitals":{}}'

      - name: Tear down container stack
        if: always()
        run: |
          docker compose down -v

  quickstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run README Quickstart commands verbatim
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          python tools/tasks.py verify
          python tools/tasks.py eval
