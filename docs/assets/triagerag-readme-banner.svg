<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f1e" />
      <stop offset="50%" stop-color="#083331" />
      <stop offset="100%" stop-color="#0b4340" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Teal Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#134e4a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Teal Healthcare Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#5eead4" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Stylized ECG / Telemetry Waveform -->
  <path d="M 0 240 L 280 240 L 310 240 L 325 210 L 340 280 L 360 160 L 380 290 L 395 230 L 415 240 L 785 240 L 800 215 L 815 275 L 835 155 L 855 295 L 870 230 L 890 240 L 1200 240"
        fill="none" stroke="url(#lineGrad)" stroke-width="2.5" opacity="0.65" />

  <!-- Center Decorative Glow Ring -->
  <circle cx="600" cy="115" r="140" fill="#14b8a6" opacity="0.06" filter="url(#glow)" />

  <!-- Shield & Stethoscope Modern Icon Mark -->
  <g transform="translate(600, 72) scale(0.95)">
    <!-- Stethoscope / Cross Emblem Shield -->
    <path d="M 0 -36 L 28 -22 C 28 8, 16 32, 0 42 C -16 32, -28 8, -28 -22 Z"
          fill="#0d9488" stroke="#2dd4bf" stroke-width="2" opacity="0.9" />
    <!-- Medical Cross inside Shield -->
    <path d="M -5 -12 H 5 V -4 H 13 V 6 H 5 V 14 H -5 V 6 H -13 V -4 H -5 Z"
          fill="#f0fdfa" />
  </g>

  <!-- Main Project Title -->
  <text x="600" y="160" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Triage<tspan fill="#2dd4bf">RAG</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="200" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#99f6e4" letter-spacing="0.5">
    Patient-Aware Retrieval • Evidence-Grounded Reasoning • Deterministic Safety Checks
  </text>

  <!-- Core Thesis Highlight Banner -->
  <text x="600" y="235" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="600" fill="#ccfbf1">
    RULE R1: &quot;Code decides; the LLM interface explains.&quot;
  </text>

  <!-- Bottom Interactive Status Badges -->
  <g transform="translate(190, 275)">
    <!-- Badge 1: Deterministic Engine -->
    <g transform="translate(0, 0)">
      <rect width="250" height="40" rx="8" fill="url(#badgeBg)" stroke="#14b8a6" stroke-width="1.2" />
      <circle cx="20" cy="20" r="4.5" fill="#2dd4bf" />
      <text x="35" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="12" font-weight="600" fill="#f0fdfa">Deterministic Pure-Python Engine</text>
    </g>

    <!-- Badge 2: Fail-Closed Gate -->
    <g transform="translate(285, 0)">
      <rect width="250" height="40" rx="8" fill="url(#badgeBg)" stroke="#14b8a6" stroke-width="1.2" />
      <circle cx="20" cy="20" r="4.5" fill="#f59e0b" />
      <text x="35" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="12" font-weight="600" fill="#f0fdfa">Fail-Closed &amp; BLOCK Interlocks</text>
    </g>

    <!-- Badge 3: Verifiable Citations -->
    <g transform="translate(570, 0)">
      <rect width="250" height="40" rx="8" fill="url(#badgeBg)" stroke="#14b8a6" stroke-width="1.2" />
      <circle cx="20" cy="20" r="4.5" fill="#38bdf8" />
      <text x="35" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="12" font-weight="600" fill="#f0fdfa">Machine-Verified Chunk Citations</text>
    </g>
  </g>

  <!-- Top Border Accent Line -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#2dd4bf" stroke-width="2" opacity="0.4" />
</svg>
