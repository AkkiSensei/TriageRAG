[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triagerag"
version = "0.1.0"
description = "Deterministic emergency-triage decision support and machine-verified plan drafting"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TriageRAG Authors" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "pint>=0.23",
    "rapidfuzz>=3.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "import-linter>=2.0",
    "pre-commit",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
llm = [
    "google-genai>=0.1.0",
]
dense = [
    "sentence-transformers>=2.7.0",
]

[project.scripts]
triagerag = "triagerag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "triagerag.contracts.*",
    "triagerag.normalize.*",
    "triagerag.engine.*",
]
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "rapidfuzz.*",
    "pint.*",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: mark test as requiring network access (disabled by default in conftest)",
]

[tool.importlinter]
root_package = "triagerag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Isolation of core engine"
type = "forbidden"
source_modules = [
    "triagerag.contracts",
    "triagerag.normalize",
    "triagerag.engine",
]
forbidden_modules = [
    "triagerag.llm",
    "triagerag.rag",
    "triagerag.verify",
    "triagerag.audit",
    "triagerag.orchestrator",
    "triagerag.ui",
    "triagerag.cli",
    "triagerag.api",
    "fastapi",
    "uvicorn",
    "openai",
    "anthropic",
    "google",
    "langchain",
    "llama_index",
    "chromadb",
    "sentence_transformers",
    "rank_bm25",
    "streamlit",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "triagerag.ui | triagerag.cli | triagerag.api",
    "triagerag.orchestrator",
    "triagerag.verify | triagerag.audit",
    "triagerag.llm | triagerag.rag",
    "triagerag.engine",
    "triagerag.normalize",
    "triagerag.contracts",
]
