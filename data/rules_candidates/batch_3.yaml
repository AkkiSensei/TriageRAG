    type: "route_concentration"
    drug_id: "epinephrine"
    max_concentration_mg_per_ml: 1.0
    allowed_routes:
      - "im"
    severity: "HIGH"
    status: "ACTIVE"
    consequence: "IM epinephrine must be administered using standard 1 mg/mL concentration to prevent excessive injection volume."
    action: "Use 1 mg/mL (1:1,000) concentration for intramuscular injection in the anterolateral thigh."
