rules:
  - id: "NE-01"
    type: "route_concentration"
    drug_id: "epinephrine"
    max_concentration_mg_per_ml: 0.1
    allowed_routes:
      - "iv"
    severity: "BLOCK"
    status: "ACTIVE"
    consequence: "IV bolus administration of undiluted 1 mg/mL (1:1,000) epinephrine causes severe tachyarrhythmias, malignant hypertension, and intracranial hemorrhage."
    action: "Do not give 1 mg/mL epinephrine IV bolus. Dilute to 0.1 mg/mL (1:10,000) or 0.01 mg/mL for intravenous administration."
    requires_fields:
      - "plan_step.concentration_mg_per_ml"
