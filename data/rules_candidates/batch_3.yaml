  - id: "ID-10"
    type: "rate_limit"
    drug_id: "vancomycin"
    max_rate_mg_per_min: 10
    severity: "HIGH"
    status: "ACTIVE"
    consequence: "Rapid IV vancomycin infusion triggers massive histamine release, profound hypotension, and red man syndrome."
    action: "Infuse vancomycin at a rate not exceeding 10 mg/min (or over at least 60 minutes, whichever is longer)."
    requires_fields:
