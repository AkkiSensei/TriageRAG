  - id: "CNS-14"
    type: "rate_limit"
    drug_id: "phenytoin"
    max_rate_mg_per_min: 50
    severity: "HIGH"
    status: "ACTIVE"
    consequence: "Infusing IV phenytoin faster than 50 mg/min induces severe hypotension, bradycardia, and cardiovascular collapse."
    action: "Limit IV phenytoin infusion rate to no more than 50 mg/min (and 1 to 3 mg/kg/min in pediatrics) with cardiac monitoring."
    requires_fields:
      - "plan_step.rate_mg_per_min"
    provenance:
