  - id: "NE-03"
    type: "route_concentration"
    drug_id: "potassium_chloride"
    max_concentration_mg_per_ml: 0.4
    allowed_routes:
      - "iv"
    severity: "BLOCK"
    status: "ACTIVE"
    consequence: "Undiluted or concentrated IV potassium administration causes instantaneous cardiac arrest and asystole."
    action: "Never administer potassium chloride undiluted or as an IV push. Must be diluted in IV infusion fluids."
    requires_fields:
      - "plan_step.concentration_mg_per_ml"
      - "plan_step.route"
    provenance:
