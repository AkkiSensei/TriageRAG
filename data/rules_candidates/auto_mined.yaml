    verified: false
    reviewer: null
- id: AUTO_MINED_CV_03
  type: route_concentration
  drug_id: verapamil
  prohibited_routes:
  - iv
  severity: BLOCK
  status: ACTIVE
  consequence: Concomitant IV verapamil and IV beta-blockers causes severe bradycardia
    and asystole.
  action: Do not administer IV verapamil with concurrent IV beta-blockers.
  requires_fields:
  - plan_step.route
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-verapamil-6db832
    section_ref: Contraindications
    version_or_date: '20240115'
    source_status: RETRIEVED_UNREVIEWED
