# TRIAGERAG — AUTO-MINED REGULATORY CANDIDATE RULES (AUB T6.6)
# Research prototype. Synthetic data only. Not a medical device. Not for clinical use.
# Status: RETRIEVED_UNREVIEWED | Origin: SOURCE_EXTRACT | Verified: false

rules:
- id: AUTO_MINED_CNS_01
  type: condition_contraindication
  drug_id: morphine
  condition: acute_respiratory_depression
  prohibited_status: 'yes'
  severity: BLOCK
  status: ACTIVE
  consequence: Morphine worsens respiratory depression and precipitates fatal respiratory
    arrest.
  action: 'Contraindicated: do not administer morphine in respiratory depression without
    airway control.'
  requires_fields:
  - conditions
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-morphine-26fdca
    section_ref: Contraindications
    version_or_date: '20240115'
    source_status: RETRIEVED_UNREVIEWED
    content_origin: SOURCE_EXTRACT
    verified: false
    reviewer: null
- id: AUTO_MINED_CV_01
  type: condition_contraindication
  drug_id: adenosine
  condition: asthma
  prohibited_status: 'yes'
  severity: BLOCK
  status: ACTIVE
  consequence: Adenosine triggers severe bronchospasm in asthma and reactive airway
    disease.
  action: 'Absolute contraindication: do not administer adenosine to patients with
    active asthma.'
  requires_fields:
  - conditions
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-adenosine-68613d
    section_ref: Contraindications
    version_or_date: '20240115'
    source_status: RETRIEVED_UNREVIEWED
    content_origin: SOURCE_EXTRACT
    verified: false
    reviewer: null
- id: AUTO_MINED_AC_01
  type: condition_contraindication
  drug_id: warfarin
  condition: active_pathological_bleeding
  prohibited_status: 'yes'
  severity: BLOCK
  status: ACTIVE
  consequence: Warfarin causes catastrophic ongoing hemorrhage in active pathological
    bleeding.
  action: 'Absolute contraindication: withhold warfarin in active bleeding.'
  requires_fields:
  - conditions
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-warfarin-41ff21
    section_ref: Contraindications
    version_or_date: '20240115'
    source_status: RETRIEVED_UNREVIEWED
