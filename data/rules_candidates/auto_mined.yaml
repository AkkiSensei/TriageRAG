    verified: false
    reviewer: null
- id: AUTO_MINED_CNS_04
  type: class_interaction
  class_a: BENZODIAZEPINES
  class_b: OPIOIDS
  severity: BLOCK
  status: ACTIVE
  consequence: Concomitant benzodiazepine and opioid administration causes profound
    sedation and respiratory arrest.
  action: Avoid concurrent use unless patient is intubated or under continuous airway
    monitoring.
  requires_fields:
