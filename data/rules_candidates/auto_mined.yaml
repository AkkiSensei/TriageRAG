    verified: false
    reviewer: null
- id: AUTO_MINED_AC_02
  type: route_concentration
  drug_id: heparin
  prohibited_routes:
  - im
  severity: BLOCK
  status: ACTIVE
  consequence: Intramuscular heparin produces extensive muscle hematomas, compartment
    syndrome, and bleeding.
  action: 'Route prohibited: never administer heparin intramuscularly.'
  requires_fields:
  - plan_step.route
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-heparin-d62908
    section_ref: Contraindications
    version_or_date: '20240115'
    source_status: RETRIEVED_UNREVIEWED
