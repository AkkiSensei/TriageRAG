    reviewer: null
- id: AUTO_MINED_CNS_03
  type: pair
  drug_a: morphine
  drug_b: diazepam
  severity: BLOCK
  status: ACTIVE
  consequence: Concurrent opioid and benzodiazepine causes profound respiratory collapse
    and death.
  action: 'Absolute contraindication: avoid concurrent IV boluses unless under invasive
    mechanical ventilation.'
  requires_fields:
  - medications
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-morphine-26fdca
    section_ref: Drug Interactions
    version_or_date: '20240115'
    source_status: RETRIEVED_UNREVIEWED
