    verified: false
    reviewer: null
- id: AUTO_MINED_CV_04
  type: pair
  drug_a: amiodarone
  drug_b: digoxin
  severity: HIGH
  status: ACTIVE
  consequence: Amiodarone inhibits P-glycoprotein, doubling serum digoxin concentrations
    and precipitating arrhythmias.
  action: 'High alert: reduce digoxin dose by 50% and monitor ECG/digoxin levels.'
  requires_fields:
  - medications
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-amiodarone-f7a5d8
    section_ref: Drug Interactions
    version_or_date: '20240115'
