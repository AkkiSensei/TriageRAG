    reviewer: null
- id: AUTO_MINED_CNS_02
  type: pair
  drug_a: tramadol
  drug_b: ondansetron
  severity: HIGH
  status: ACTIVE
  consequence: Concurrent tramadol and ondansetron increases serotonin syndrome risk
    and reduces analgesia.
  action: 'Caution: Monitor for signs of serotonin toxicity; consider non-serotonergic
    antiemetic.'
  requires_fields:
  - medications
  provenance:
    source_doc: OPENFDA_SPL_openfda-label-tramadol-f58878
    section_ref: Drug Interactions
    version_or_date: '20240115'
