# HUMAN DECISION HD-2: Authoritative neonate/paediatric/adult boundaries and months->days convention.
age_classification:
  days_per_month: 30
  days_per_year: 365
  neonate_max_days: 28
  adult_min_years: 18
  adult_min_days: 6570
  max_days_input: 365
  max_months_input: 48
  max_years_input: 130
  paediatric_bands:
    - band_id: "paediatric_1m_1y"
      min_days_exclusive: 28
      max_days_inclusive: 365
    - band_id: "paediatric_1_5y"
      min_days_exclusive: 365
      max_days_inclusive: 1825
