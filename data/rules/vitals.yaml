rules:
  - id: "VITALS_NITROGLYCERIN_HYPOTENSION"
    type: "vitals_interlock"
    drug_id: "nitroglycerin"
    vital_name: "systolic_bp_mmhg"
    operator: "lt"
    threshold_value: 90
    severity: "BLOCK"
    status: "ACTIVE"
    consequence: "Nitroglycerin administration in systolic hypotension (SBP < 90 mmHg) precipitates cardiovascular collapse."
    action: "Do not administer nitroglycerin. Optimize preload and hemodynamic stability."
    requires_fields:
      - "systolic_bp_mmhg"
    provenance:
