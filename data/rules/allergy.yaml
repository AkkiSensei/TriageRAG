      verified: false
      reviewer: null

  - id: "ALLERGY_BETALACTAM_SCAR_CATCHALL"
    type: "allergy_crossreactivity"
    allergen_class: "BETA_LACTAMS"
    target_class: "BETA_LACTAMS"
    reaction_types:
      - "severe_cutaneous_scar"
    severity: "BLOCK"
    cross_reactivity_risk: "BLOCK"
    status: "ACTIVE"
    consequence: "History of Severe Cutaneous Adverse Reaction (SCAR/DRESS/SJS/TEN) contraindicates all beta-lactam class antimicrobials regardless of side-chain."
    action: "Absolute contraindication: do not administer any beta-lactam antimicrobial."
    requires_fields:
      - "allergies"
      - "allergy_history_status"
